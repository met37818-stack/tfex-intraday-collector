name: Collect TFEX 1-Minute Data

on:
  schedule:
    # Run every 1 minute during TFEX trading sessions and checkpoint alert windows (Mon-Fri)
    # Morning: 09:45 - 13:00 BKK (02:45 - 06:00 UTC) -> UTC hours 2-5
    # Afternoon: 14:15 - 17:30 BKK (07:15 - 10:30 UTC) -> UTC hours 7-10
    - cron: '*/1 2-5,7-10 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run data collection (bypass trading hours guard)'
        type: boolean
        required: true
        default: true
      notify_only:
        description: 'Send Telegram status notification only (--notify)'
        type: boolean
        required: false
        default: false

jobs:
  collect-tfex:
    name: Collect TFEX Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute TFEX Data Collector
        env:
          SETTRADE_APP_ID: ${{ secrets.SETTRADE_APP_ID }}
          SETTRADE_APP_SECRET: ${{ secrets.SETTRADE_APP_SECRET }}
          SETTRADE_BROKER_ID: ${{ secrets.SETTRADE_BROKER_ID }}
          SETTRADE_APP_CODE: ${{ secrets.SETTRADE_APP_CODE }}
          SETTRADE_IS_SANDBOX: ${{ secrets.SETTRADE_IS_SANDBOX }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.notify_only }}" = "true" ]; then
            echo "[RUNNER] Manual dispatch with notify_only=true. Executing with --notify flag..."
            python collector.py --notify
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_run }}" = "true" ]; then
            echo "[RUNNER] Manual dispatch with force_run=true. Executing with --force flag..."
            python collector.py --force
          else
            echo "[RUNNER] Regular scheduled trigger. Checking trading hours guard..."
            python collector.py
          fi
