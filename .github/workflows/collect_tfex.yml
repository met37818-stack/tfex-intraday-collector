name: Collect TFEX 1-Minute Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        type: choice
        options:
          - session
          - once
          - notify
          
        required: true
        default: session
      force:
        description: 'Bypass trading hours and holiday guards (--force)'
        type: boolean
        required: false
        default: false

jobs:
  collect-tfex:
    name: TFEX Persistent Session Collector
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute TFEX Data Collector
        env:
          SETTRADE_APP_ID: ${{ secrets.SETTRADE_APP_ID }}
          SETTRADE_APP_SECRET: ${{ secrets.SETTRADE_APP_SECRET }}
          SETTRADE_BROKER_ID: ${{ secrets.SETTRADE_BROKER_ID }}
          SETTRADE_APP_CODE: ${{ secrets.SETTRADE_APP_CODE }}
          SETTRADE_IS_SANDBOX: ${{ secrets.SETTRADE_IS_SANDBOX }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            echo "[RUNNER] Manual dispatch with mode: $MODE $FORCE_FLAG"
            if [ "$MODE" = "notify" ]; then
              python collector.py --notify
            elif [ "$MODE" = "clean" ]; then
              python collector.py --clean
            elif [ "$MODE" = "once" ]; then
              python collector.py --once $FORCE_FLAG
            else
              python collector.py --session $FORCE_FLAG
            fi
          else
            echo "[RUNNER] Scheduled trigger: Starting persistent session worker..."
            python collector.py --session
          fi

      - name: Report runner failure to Telegram
        # The application sends its own 🚨 when an exception passes through its entry
        # point. This step catches what that cannot: a timeout, a cancelled run, or a
        # process killed before the collector reached its own error handling. Uses only
        # curl, so it still works when the pip install step is what failed.
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "[RUNNER] no Telegram credentials; skipping runner-failure notice"
            exit 0
          fi
          TEXT="🚨 ${WORKFLOW_NAME}
          runner ปิดงานแบบไม่ปกติ: ${RUN_STATUS}
          สาเหตุที่เป็นไปได้: timeout / ถูกยกเลิก / process ตายก่อนถึง entry point
          (ถ้าได้รับ 🚨 จากตัวแอปไปแล้ว ข้อความนี้คือ fallback ของ runner)
          ${RUN_URL}"
          echo "[RUNNER] sending runner-failure notice (status=${RUN_STATUS})"
          # -f so an HTTP 4xx counts as a failure; the file is a Telegram error
          # envelope (no token) and only its presence is logged.
          if curl -fsS --max-time 15 -o /tmp/tg_runner_failure.json \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
               --data-urlencode "text=${TEXT}"; then
            echo "[RUNNER] runner-failure notice delivered"
          else
            echo "[RUNNER] runner-failure notice not delivered (non-fatal)"
          fi
