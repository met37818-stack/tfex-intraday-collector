name: Collect TFEX 1-Minute Data

on:
  schedule:
    # Run every 1 minute during TFEX trading sessions (Mon-Fri)
    # Morning: 09:45 - 12:30 BKK (02:45 - 05:30 UTC)
    # Afternoon: 14:15 - 16:55 BKK (07:15 - 09:55 UTC)
    # Covered by UTC hours 2-5 and 7-9
    - cron: '*/1 2-5,7-9 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run data collection (bypass trading hours guard)'
        type: boolean
        required: true
        default: true

jobs:
  collect-tfex:
    name: Collect TFEX Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute TFEX Data Collector
        env:
          SETTRADE_APP_ID: ${{ secrets.SETTRADE_APP_ID }}
          SETTRADE_APP_SECRET: ${{ secrets.SETTRADE_APP_SECRET }}
          SETTRADE_BROKER_ID: ${{ secrets.SETTRADE_BROKER_ID }}
          SETTRADE_APP_CODE: ${{ secrets.SETTRADE_APP_CODE }}
          SETTRADE_IS_SANDBOX: ${{ secrets.SETTRADE_IS_SANDBOX }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_run }}" = "true" ]; then
            echo "[RUNNER] Manual dispatch with force_run=true. Executing with --force flag..."
            python collector.py --force
          else
            echo "[RUNNER] Regular scheduled trigger. Checking trading hours guard..."
            python collector.py
          fi
